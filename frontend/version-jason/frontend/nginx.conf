server {
    listen 80;
    listen [::]:80;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Salud del servidor del frontend; no modifica ni consulta la base de datos.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Los assets de Vite incluyen hash; un archivo inexistente debe devolver 404.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React / Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Spring Boot
    location ~ ^/api(?:/|$) {
        # DNS interno de Docker: vuelve a resolver si se recrea el backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        # Sin URI adicional: conservar /api, el resto de la ruta y los parametros.
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
    }

    # Evitar cache del index
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
