spring.application.name=inventario

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=${PORT:8080}

# Clave Base64 de al menos 32 bytes, definida fuera del repositorio.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# Las respuestas de error no deben exponer detalles internos, incluso con DevTools.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Exponer únicamente la comprobación de salud.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Documentación de contratos; no cambia los permisos de la API de negocio.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.packages-to-scan=com.utec.inventario.controller
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

# Límites de login por instancia; no guarda contraseñas ni bloquea cuentas en BD.
app.login-rate-limit.max-failures=${LOGIN_MAX_FAILURES:5}
app.login-rate-limit.failure-window-seconds=${LOGIN_FAILURE_WINDOW_SECONDS:900}
app.login-rate-limit.ip-attempts=${LOGIN_IP_ATTEMPTS:60}
app.login-rate-limit.ip-window-seconds=${LOGIN_IP_WINDOW_SECONDS:60}
app.login-rate-limit.max-entries=${LOGIN_MAX_ENTRIES:10000}
