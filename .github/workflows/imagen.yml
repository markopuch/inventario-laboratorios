name: Imagenes Docker del backend y frontend Jason

on:
  push:
    branches:
      - main
    paths:
      - "backend/inventario/**"
      - "frontend/version-jason/frontend/**"
      - ".github/workflows/imagen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: Publicar ${{ matrix.nombre }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            contexto: ./backend/inventario
            dockerfile: ./backend/inventario/Dockerfile
          - nombre: frontend-jason
            contexto: ./frontend/version-jason/frontend
            dockerfile: ./frontend/version-jason/frontend/Dockerfile

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar el nombre y la etiqueta
        env:
          COMPONENTE: ${{ matrix.nombre }}
        shell: bash
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENTE}" >> "$GITHUB_ENV"
          echo "CORTO=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Preparar Node para las pruebas de Jason
        # Las pruebas de contratos leen los DTO del backend descargados por checkout.
        if: matrix.nombre == 'frontend-jason'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Comprobar contratos y logica del frontend Jason
        if: matrix.nombre == 'frontend-jason'
        working-directory: frontend/version-jason/frontend
        run: |
          npm ci
          npm test

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar ${{ matrix.nombre }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:sha-${{ env.CORTO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
