name: Verificar y publicar backend y frontend Jason

on:
  push:
    branches: [main]
    paths:
      - "backend/inventario/**"
      - "docs/backend-final/postman/**"
      - "frontend/version-jason/frontend/**"
      - "scripts/**"
      - "importar-inventario-demo.ps1"
      - "iniciar-backend.ps1"
      - "verificar-backend.ps1"
      - ".github/workflows/imagen.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/inventario/**"
      - "docs/backend-final/postman/**"
      - "frontend/version-jason/frontend/**"
      - "scripts/**"
      - "importar-inventario-demo.ps1"
      - "iniciar-backend.ps1"
      - "verificar-backend.ps1"
      - ".github/workflows/imagen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-backend:
    name: Java 21 y JUnit con PostgreSQL temporal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Preparar Node para validar scripts Postman
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validar coleccion Postman contra Controllers y DTO
        run: python3 -B docs/backend-final/postman/validar_coleccion.py
      - name: Compilar y probar con base exclusiva del runner
        working-directory: backend/inventario
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL=jdbc:postgresql://127.0.0.1:5432/inventario_verificacion_ci
          export DB_USER=inventario_ci
          export DB_PASSWORD="$(openssl rand -base64 32)"
          export DEMO_USER_PASSWORD="Aa1!$(openssl rand -base64 24)"
          export JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DEMO_USER_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          export SPRING_PROFILES_ACTIVE=dev
          export SPRING_FLYWAY_CLEAN_DISABLED=true
          export SPRING_JPA_HIBERNATE_DDL_AUTO=validate
          contenedor="inventario-junit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # No usa puertos, volumenes, credenciales o bases de entornos existentes.
          # El servicio se crea despues de generar sus claves aleatorias.
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$contenedor" \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=inventario_verificacion_ci \
            --env POSTGRES_USER=inventario_ci \
            --env 'POSTGRES_INITDB_ARGS=--locale-provider=builtin --builtin-locale=C.UTF-8' \
            --env POSTGRES_PASSWORD postgres:18-alpine
          listo=false
          for intento in $(seq 1 60); do
            if docker exec "$contenedor" pg_isready -h 127.0.0.1 -U inventario_ci -d inventario_verificacion_ci; then
              listo=true
              break
            fi
            sleep 1
          done
          test "$listo" = true
          # Literal SQL ASCII para comprobar las mayusculas de nombres con acentos.
          mayusculas=$(docker exec "$contenedor" psql -U inventario_ci -d inventario_verificacion_ci \
            -X -v ON_ERROR_STOP=1 -t -A -c "SELECT upper(U&'Mecatr\00F3nica') = U&'MECATR\00D3NICA';")
          test "$mayusculas" = t
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew compileJava test bootJar --rerun-tasks --no-daemon --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path("build/test-results/test").glob("TEST-*.xml"))
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("Resultados JUnit:", totals)
          if not paths or totals["tests"] == 0 or any(totals[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("JUnit debe ejecutar pruebas sin fallos, errores ni omitidas")
          PY

  verificar-frontend:
    name: Contratos, logica y build Jason
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verificar frontend desde el monorepo completo
        working-directory: frontend/version-jason/frontend
        run: |
          npm ci
          npm test
          npm run build

  verificar-importador:
    name: Importador con Excel sintetico y API simulada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Instalar lector Excel
        run: python -m pip install openpyxl==3.1.5
      - name: Comprobar preparacion y reanudacion sin datos privados
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  imagen:
    name: Publicar ${{ matrix.nombre }}
    needs: [verificar-backend, verificar-frontend, verificar-importador]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            contexto: ./backend/inventario
            dockerfile: ./backend/inventario/Dockerfile
          - nombre: frontend-jason
            contexto: ./frontend/version-jason/frontend
            dockerfile: ./frontend/version-jason/frontend/Dockerfile
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar el nombre y la etiqueta
        env:
          COMPONENTE: ${{ matrix.nombre }}
        shell: bash
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENTE}" >> "$GITHUB_ENV"
          echo "CORTO=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar ${{ matrix.nombre }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:sha-${{ env.CORTO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
